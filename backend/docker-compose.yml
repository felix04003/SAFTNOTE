version: '3.9'

services:

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecole_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecole_manager}
      POSTGRES_USER: ${POSTGRES_USER:-ecole_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # auto-exécuté au premier démarrage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecole_user -d ecole_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecole_redis
    restart: unless-stopped
    command: sh -c "redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a ${REDIS_PASSWORD:-} ping 2>/dev/null || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (stockage PDF bulletins) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: ecole_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── API Backend ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecole_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecole_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecole_manager}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: http://localhost:3003
      RATE_LIMIT_AUTH_MAX: "100"
      RATE_LIMIT_REGISTER_MAX: "50"
    ports:
      - "3010:3000"
    volumes:
      - ./src:/app/src        # hot-reload en dev
      - ./migrations:/app/migrations
    command: node src/app.js

  # ── Worker notifications ───────────────────────────────
  worker-notif:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecole_worker_notif
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecole_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecole_manager}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: npm run worker:notif

volumes:
  pgdata:
  redisdata:
  miniodata:
