version: '3.9'

services:

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecole_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecole_manager
      POSTGRES_USER: ecole_user
      POSTGRES_PASSWORD: ecole_password_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # auto-exécuté au premier démarrage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecole_user -d ecole_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecole_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (stockage PDF bulletins) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: ecole_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── API Backend ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecole_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://ecole_user:ecole_password_dev@postgres:5432/ecole_manager
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin123
      JWT_SECRET: dev_jwt_secret_change_in_production_32chars
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src        # hot-reload en dev
      - ./migrations:/app/migrations
    command: npm run dev

  # ── Worker notifications ───────────────────────────────
  worker-notif:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecole_worker_notif
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ecole_user:ecole_password_dev@postgres:5432/ecole_manager
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: npm run worker:notif

volumes:
  pgdata:
  redisdata:
  miniodata:
