name: CI — EcoleManager

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  #  Backend : Lint + Tests unitaires
  # ──────────────────────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test -- --ci --forceExit
        env:
          NODE_ENV: test

      # Lot G (finding E4, audit 2026-09) : audit de sécurité informatif,
      # non bloquant pour l'instant (continue-on-error). Objectif : le rendre
      # bloquant une fois que mobile/ et dashboard/ auront pu être nettoyés
      # des vulnérabilités restantes qui nécessitent une montée majeure du
      # SDK Expo (mobile) ou de Vite/Vitest (dashboard, déjà fait dans ce lot
      # mais à surveiller pour les prochaines CVE).
      - name: Audit de sécurité (informatif)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  #  Backend : Tests d'intégration (PostgreSQL + Redis réels)
  # ──────────────────────────────────────────────────────
  # Lot J (E5, audit 2026-09) : les 15 fichiers de tests d'intégration
  # existants (backend/tests/integration/*.integration.test.js) tournaient
  # déjà contre un vrai PostgreSQL en local, mais n'étaient jamais exécutés
  # en CI (seul `npm test`, unitaire avec mocks, l'était). Ce job les fait
  # tourner sur des services PostgreSQL 16 et Redis 7 éphémères.
  backend-integration:
    name: Backend — Tests d'intégration
    runs-on: ubuntu-latest
    needs: backend-lint-test
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecole_manager_test
          POSTGRES_USER: ecole_user
          POSTGRES_PASSWORD: ecole_password_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ecole_user -d ecole_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: ecole_manager_test
      POSTGRES_USER: ecole_user
      POSTGRES_PASSWORD: ecole_password_dev
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci_integration_jwt_secret_32_chars_min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Appliquer les migrations
        run: node src/utils/migrate.js

      - name: Injecter les seeds de test
        run: node src/utils/seed-test.js

      - name: Tests d'intégration
        run: npm run test:integration

  # ──────────────────────────────────────────────────────
  #  Backend : Docker build
  # ──────────────────────────────────────────────────────
  backend-docker:
    name: Backend — Docker Build
    runs-on: ubuntu-latest
    needs: backend-lint-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        # Contexte = racine du dépôt (lot F2) : backend/Dockerfile copie
        # aussi migrations/, qui vit désormais à la racine (lot A).
        run: docker build -t ecolemanager-api:ci -f backend/Dockerfile .

  # ──────────────────────────────────────────────────────
  #  Mobile : Tests unitaires (couche offline SQLite/sync/API)
  # ──────────────────────────────────────────────────────
  mobile-test:
    name: Mobile — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Lot G (finding E4, audit 2026-09) : mobile/package-lock.json était
      # gitignoré et l'install se faisait via `npm install --legacy-peer-deps`,
      # ce qui rendait le build non reproductible. Le lockfile est désormais
      # commité et régénéré proprement (`npx expo install --check`/`--fix`
      # ont aligné les versions natives sur le SDK Expo installé) : `npm ci`
      # sans --legacy-peer-deps s'installe sans conflit de peer deps.
      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires
        run: npm run test:ci

  # ──────────────────────────────────────────────────────
  #  Mobile : TypeScript check
  # ──────────────────────────────────────────────────────
  mobile-typecheck:
    name: Mobile — TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────
  #  Dashboard : tests unitaires (Vitest) + build de production
  # ──────────────────────────────────────────────────────
  # Aucun job ne couvrait dashboard/ : ses tests Vitest et son build (Vite)
  # n'étaient jamais exécutés en CI.
  dashboard-test:
    name: Dashboard — Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build de production
        run: npm run build

  # ──────────────────────────────────────────────────────
  #  Dashboard : tests E2E Playwright contre un vrai backend
  # ──────────────────────────────────────────────────────
  # Backend (PostgreSQL 16 + Redis 7 éphémères) + dashboard construit pour une
  # API de même origine : la CSP du dashboard interdit tout autre domaine, donc
  # dashboard/tests/serve-e2e.js sert dist/ et relaie /api vers le backend.
  # Limites d'authentification relevées : la suite fait plusieurs connexions
  # et inscriptions depuis la même adresse (POST /inscription : 5/heure sinon).
  dashboard-e2e:
    name: Dashboard — Tests E2E (Playwright)
    runs-on: ubuntu-latest
    needs: dashboard-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecole_manager_e2e
          POSTGRES_USER: ecole_user
          POSTGRES_PASSWORD: ecole_password_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ecole_user -d ecole_manager_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: development
      PORT: 3010
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      POSTGRES_DB: ecole_manager_e2e
      POSTGRES_USER: ecole_user
      POSTGRES_PASSWORD: ecole_password_dev
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci_e2e_jwt_secret_32_chars_minimum_ok
      JWT_REFRESH_SECRET: ci_e2e_refresh_secret_32_chars_min_ok
      RATE_LIMIT_AUTH_MAX: 1000
      RATE_LIMIT_REFRESH_MAX: 1000
      RATE_LIMIT_REGISTER_MAX: 1000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            dashboard/package-lock.json
            dashboard/tests/package-lock.json

      - name: Backend — dépendances, migrations, seeds
        working-directory: backend
        run: |
          npm ci
          node src/utils/migrate.js
          node src/utils/seed-test.js

      - name: Backend — démarrage
        working-directory: backend
        run: |
          nohup node src/app.js > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3010/health && exit 0
            sleep 1
          done
          echo "Le backend n'a pas démarré" && cat ../backend.log && exit 1

      - name: Dashboard — build pour l'API de même origine
        working-directory: dashboard
        run: |
          npm ci
          VITE_API_BASE=http://localhost:3003/api/v1 npm run build

      - name: Dashboard — démarrage du relais /api
        working-directory: dashboard
        run: |
          nohup node tests/serve-e2e.js > ../serve.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf -o /dev/null http://localhost:3003/login.html && exit 0
            sleep 1
          done
          echo "Le dashboard n'a pas démarré" && cat ../serve.log && exit 1

      - name: Playwright — installation (Chromium)
        working-directory: dashboard/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Tests E2E
        working-directory: dashboard/tests
        run: npx playwright test

      - name: Journal du backend (en cas d'échec)
        if: failure()
        run: tail -n 200 backend.log

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dashboard/tests/playwright-report/
            dashboard/tests/test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  #  Mobile : EAS Build Android (sur tag v*)
  # ──────────────────────────────────────────────────────
  mobile-eas-build:
    name: Mobile — EAS Build (Android)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, mobile-typecheck, mobile-test]
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — Android production
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
