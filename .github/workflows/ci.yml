name: CI — EcoleManager

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  #  Backend : Lint + Tests unitaires
  # ──────────────────────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test -- --ci --forceExit
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────────────
  #  Backend : Docker build
  # ──────────────────────────────────────────────────────
  backend-docker:
    name: Backend — Docker Build
    runs-on: ubuntu-latest
    needs: backend-lint-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ecolemanager-api:ci ./backend

  # ──────────────────────────────────────────────────────
  #  Mobile : TypeScript check
  # ──────────────────────────────────────────────────────
  mobile-typecheck:
    name: Mobile — TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────
  #  Mobile : EAS Build Android (sur tag v*)
  # ──────────────────────────────────────────────────────
  mobile-eas-build:
    name: Mobile — EAS Build (Android)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, mobile-typecheck]
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build — Android production
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
