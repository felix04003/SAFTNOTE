<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoleManager — Connexion</title>
<!-- CSP (revue code-reviewer, lot H) :
     - Pas de frame-ancestors : cette directive est ignorée par les
       navigateurs quand la CSP est livrée via une balise <meta> (spec CSP3 —
       comme report-uri/report-to/sandbox, seul un en-tête HTTP la fait
       respecter). La protection anti-clickjacking réelle vient de l'en-tête
       X-Frame-Options: DENY (render.yaml, service ecolemanager-dashboard).
     - connect-src est codé en dur sur l'URL de prod et DOIT être mis à jour
       manuellement dans les 7 fichiers HTML si VITE_API_BASE change (voir
       dashboard/.env.example) — sinon tous les fetch() sont bloqués
       silencieusement par la CSP (erreur réseau opaque, rien dans l'UI).
     - style-src garde 'unsafe-inline' volontairement, uniquement pour le
       <link> Google Fonts ci-dessous — sans rapport avec le compromis
       script-src 'unsafe-inline' des pages index/enseignant/parent.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://ecolemanager-api.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self';">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="sb-mark" style="margin:0 auto 12px;width:52px;height:52px;font-size:22px;border-radius:13px">EM</div>
      <div style="font-size:20px;font-weight:800;color:var(--g900)">EcoleManager</div>
      <div style="font-size:12.5px;color:var(--g500);margin-top:4px">Gestion scolaire offline-first</div>
    </div>

    <div class="login-err" id="login-err"></div>
    <form id="login-form">
      <div class="fg">
        <label class="fl">Identifiant</label>
        <input class="fi" id="login-id" type="text" placeholder="Email ou téléphone (+221...)" required autocomplete="username">
      </div>
      <div class="fg">
        <label class="fl">Mot de passe</label>
        <div class="pwd-wrap">
          <input class="fi" id="login-pwd" type="password" placeholder="Votre mot de passe" required autocomplete="current-password">
          <button type="button" class="pwd-toggle" id="toggle-login-pwd" aria-label="Afficher le mot de passe" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="fg">
        <label class="fl">Code établissement</label>
        <input class="fi" id="login-etab" type="text" placeholder="Ex: LBD-DAKAR-01" required>
      </div>
      <button class="btn btn-p btn-full" type="submit" id="login-btn" style="margin-top:8px">
        Se connecter
      </button>
      <div style="text-align:right;margin-top:8px">
        <a href="mot-de-passe-oublie.html" style="font-size:12px;color:var(--g400);text-decoration:none">Mot de passe oublié ?</a>
      </div>
    </form>
    <p style="text-align:center;font-size:12px;color:var(--g400);margin-top:16px">
      Parent ? <a id="lien-parent" href="parent-login.html" style="color:var(--bleu)">Connexion par code SMS →</a>
    </p>
    <p style="text-align:center;font-size:12px;color:var(--g400);margin-top:8px">
      Pas encore d'établissement ? <a href="inscription.html" style="color:var(--bleu)">Créer le vôtre →</a>
    </p>

  </div>
</div>

<div class="tc" id="tc"></div>

<script type="module" src="src/login.ts"></script>
</body>
</html>
