services:
  - type: web
    name: ecolemanager-api
    runtime: node
    rootDir: backend
    # preDeployCommand n'est disponible que sur les plans payants Render —
    # ce service tourne en `plan: free`, la validation du Blueprint refuse
    # ce champ ("pre-deploy command is not supported for free tier
    # services"), empêchant la synchronisation de TOUT le Blueprint (donc
    # aussi la création du site statique ecolemanager-dashboard ci-dessous,
    # jamais provisionné tant que cette erreur bloquait la synchro).
    # Migration repliée dans buildCommand : les variables d'env du service
    # (dont DATABASE_URL) sont bien disponibles pendant le build sur Render,
    # et un échec de migrate.js fait échouer le build — même garde-fou
    # qu'un preDeployCommand, sans dépendre d'un plan payant.
    buildCommand: npm ci && node src/utils/migrate.js
    startCommand: node src/app.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3010
      - key: TRUST_PROXY_HOPS
        value: "1"
      # FRONTEND_URL manquait ici : sans elle, app.js retombe sur la
      # whitelist CORS localhost par défaut, bloquant TOUTE requête depuis
      # le vrai dashboard en production (constaté : préflight OPTIONS sans
      # en-tête Access-Control-Allow-Origin, "Failed to fetch" côté
      # navigateur sur ecolemanager-dashboard.onrender.com).
      - key: FRONTEND_URL
        value: https://ecolemanager-dashboard.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: ecolemanager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Redis (Key Value Render) : cache + files BullMQ. L'API y dépose les travaux (SMS, moyennes, bulletins) ;
      # le service ecolemanager-workers ci-dessous les exécute.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecolemanager-redis
          property: connectionString
      # Africa's Talking (SMS OTP) — obligatoire en production depuis le lot E
      # (finding E1, audit 2026-09) : sans ces deux variables, env.js
      # (validateEnv(), appelé au boot) fait crasher le démarrage du service
      # plutôt que de risquer de logguer les codes OTP en clair. À saisir
      # manuellement dans le dashboard Render (Settings > Environment) —
      # `sync: false` évite qu'un déploiement écrase une clé déjà configurée
      # avec une valeur vide.
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: META_WA_TOKEN
        value: ""          # WhatsApp Business — à renseigner pour activer WA
      - key: S3_ENDPOINT
        value: ""          # ex: https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY
        value: ""          # R2 Access Key ID
      - key: S3_SECRET_KEY
        value: ""          # R2 Secret Access Key
      - key: S3_BUCKET
        value: ""          # Nom du bucket R2
      - key: MEDICAL_ENCRYPTION_KEY
        generateValue: true
      - key: MONITORING_TOKEN
        generateValue: true
    plan: free

  # ── Workers (notifications SMS, calcul des moyennes, bulletins PDF) ──────────
  # Un seul service, trois processus (src/workers/lanceur.js). SANS lui, rien de ce qui passe par une file ne
  # s'exécute : pas de SMS (absences, notes, sanctions), pas de moyennes après publication, pas de PDF de bulletin.
  # Docker (backend/Dockerfile) parce que la génération des PDF a besoin de Chromium.
  # Plan payant obligatoire : Render n'offre pas de worker gratuit. 512 Mo (starter) peuvent manquer pour Chromium :
  # passer à `standard` si les bulletins échouent faute de mémoire.
  - type: worker
    name: ecolemanager-workers
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: node src/workers/lanceur.js
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecolemanager-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ecolemanager-redis
          property: connectionString
      # Mêmes valeurs que sur ecolemanager-api (à saisir une fois dans le dashboard Render)
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: META_WA_TOKEN
        value: ""
      - key: S3_ENDPOINT
        value: ""
      - key: S3_ACCESS_KEY
        value: ""
      - key: S3_SECRET_KEY
        value: ""
      - key: S3_BUCKET
        value: ""

  # Redis managé : file des travaux. noeviction : BullMQ ne doit jamais perdre un travail faute de mémoire.
  - type: keyvalue
    name: ecolemanager-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []          # accès interne Render uniquement

  - type: web
    name: ecolemanager-dashboard
    env: static
    buildCommand: cd dashboard && npm ci && npm run build
    staticPublishPath: ./dashboard/dist
    pullRequestPreviewsEnabled: false
    # VITE_API_BASE (lot H, finding E6) : Vite lit cette variable au moment
    # du build (buildCommand ci-dessus), pas à l'exécution — un site statique
    # n'a pas de runtime Node. Elle doit donc être définie ici pour être
    # inlinée dans le bundle. Pointe vers le service API du même render.yaml.
    envVars:
      - key: VITE_API_BASE
        value: https://ecolemanager-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /inscription
        destination: /inscription.html
      - type: rewrite
        source: /enseignant
        destination: /enseignant.html
      - type: rewrite
        source: /parent
        destination: /parent.html
    # En-têtes de sécurité (lot F3, finding E6/C5) : pendant du bloc
    # add_header de nginx/templates/ecolemanager.conf.template pour le VPS,
    # ici en syntaxe Render pour le static site du dashboard.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: ecolemanager-db
    databaseName: ecolemanager
    user: ecolemanager
    plan: free
