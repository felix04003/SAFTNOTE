services:
  - type: web
    name: ecolemanager-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    preDeployCommand: node src/utils/migrate.js
    startCommand: node src/app.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3010
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ecolemanager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        value: ""          # Redis non dispo plan gratuit — cache désactivé
      # Africa's Talking (SMS OTP) — obligatoire en production depuis le lot E
      # (finding E1, audit 2026-09) : sans ces deux variables, env.js
      # (validateEnv(), appelé au boot) fait crasher le démarrage du service
      # plutôt que de risquer de logguer les codes OTP en clair. À saisir
      # manuellement dans le dashboard Render (Settings > Environment) —
      # `sync: false` évite qu'un déploiement écrase une clé déjà configurée
      # avec une valeur vide.
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: META_WA_TOKEN
        value: ""          # WhatsApp Business — à renseigner pour activer WA
      - key: S3_ENDPOINT
        value: ""          # ex: https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY
        value: ""          # R2 Access Key ID
      - key: S3_SECRET_KEY
        value: ""          # R2 Secret Access Key
      - key: S3_BUCKET
        value: ""          # Nom du bucket R2
      - key: MEDICAL_ENCRYPTION_KEY
        generateValue: true
      - key: MONITORING_TOKEN
        generateValue: true
    plan: free

  - type: web
    name: ecolemanager-dashboard
    env: static
    buildCommand: cd dashboard && npm ci && npm run build
    staticPublishPath: ./dashboard/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /inscription
        destination: /inscription.html
      - type: rewrite
        source: /enseignant
        destination: /enseignant.html
      - type: rewrite
        source: /parent
        destination: /parent.html
    # En-têtes de sécurité (lot F3, finding E6/C5) : pendant du bloc
    # add_header de nginx/templates/ecolemanager.conf.template pour le VPS,
    # ici en syntaxe Render pour le static site du dashboard.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: ecolemanager-db
    databaseName: ecolemanager
    user: ecolemanager
    plan: free
